<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starweave — weave the night sky into constellations</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #070b1d;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 1.6));
        height: min(100vh, calc(100vw / 1.6));
        touch-action: none;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="800"></canvas>
    <script type="module">
      import { bootGame } from './src/main.js';
      bootGame(document.getElementById('game'));
    </script>
  </body>
</html>
